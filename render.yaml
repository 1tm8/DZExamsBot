services:
  - type: worker
    name: dzexams-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: dzexams-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: /app/data/dzexams.db
      - key: TMP_DIR
        value: /app/data/tmp
      - key: PYTHON_VERSION
        value: 3.12.0
