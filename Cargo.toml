[package]
name = "dzexams-bot"
version = "1.0.0"
edition = "2021"
description = "بوت تيليغرام لتصفح موارد dzexams.com (إعادة كتابة بلغة Rust)"
license = "MIT"
authors = ["عبد الرؤوف Dev"]

[lib]
name = "dzexams_bot"
path = "src/lib.rs"

[[bin]]
name = "dzexams-bot"
path = "src/main.rs"

[[bin]]
name = "dzexams-crawler"
path = "src/bin/crawler.rs"

[dependencies]
# تيليغرام — بدون native-tls لتفادي اعتماد OpenSSL وقت البناء
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "sync", "fs", "signal", "net"] }
# نفس إصدار reqwest الذي تستخدمه teloxide لتفادي ترجمة نسختين
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks", "cookies", "gzip", "brotli", "deflate", "charset", "http2"] }
rusqlite = { version = "0.43", features = ["bundled"] }
regex = "1"
base64 = "0.23"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rand = "0.10"
chrono = "0.4"
futures = "0.3"
html-escape = "0.3"
once_cell = "1"
log = "0.4"
env_logger = "0.11"
which = "8"
glob = "0.3"
indexmap = "2"
url = "2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
